<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo (Dark Slate) -->
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Gradiente de Telemetria (Cyan) -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    
    <!-- Gradiente do Edifício Principal -->
    <linearGradient id="buildingMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Base do Ícone -->
  <rect width="64" height="64" rx="14" fill="url(#bgSlate)" />
  <rect width="64" height="64" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Sinal de Wi-Fi (Conectividade / IoT) -->
  <circle cx="32" cy="20" r="2.5" fill="#22d3ee" />
  <path d="M 26 15 Q 32 10 38 15" fill="none" stroke="url(#cyanGlow)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 19 9 Q 32 -1 45 9" fill="none" stroke="url(#cyanGlow)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Complexo Predial (BMS) -->
  
  <!-- Bloco Esquerdo (Instalações secundárias) -->
  <path d="M 18 52 L 18 36 L 26 36 L 26 52 Z" fill="#475569" />
  <rect x="21" y="40" width="2" height="2" fill="#94a3b8" />
  <rect x="21" y="45" width="2" height="2" fill="#94a3b8" />

  <!-- Bloco Central (Torre de controle / Destaque) -->
  <path d="M 27 52 L 27 24 L 37 24 L 37 52 Z" fill="url(#buildingMain)" />
  <rect x="31" y="28" width="2" height="2" fill="#020617" />
  <rect x="31" y="34" width="2" height="2" fill="#020617" />
  <rect x="31" y="40" width="2" height="2" fill="#020617" />
  <rect x="31" y="46" width="2" height="2" fill="#020617" />

  <!-- Bloco Direito -->
  <path d="M 38 52 L 38 32 L 46 32 L 46 52 Z" fill="#64748b" />
  <rect x="41" y="36" width="2" height="2" fill="#cbd5e1" />
  <rect x="41" y="41" width="2" height="2" fill="#cbd5e1" />
  <rect x="41" y="46" width="2" height="2" fill="#cbd5e1" />
</svg>
