services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  ml:
    build: ./ml
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local_only}@postgres:5432/${POSTGRES_DB:-sentinel}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-replace_with_a_long_random_local_token}
      MODEL_PATH: /models/isolation-forest.joblib
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ml_models:/models
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local_only}@postgres:5432/${POSTGRES_DB:-sentinel}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-replace_with_a_long_random_local_token}
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

  mqtt-collector:
    build: .
    command: ["npm", "run", "collector"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_local_only}@postgres:5432/${POSTGRES_DB:-sentinel}
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres_data:
  mosquitto_data:
  ml_models: